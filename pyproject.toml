[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "menucost"
version = "0.1.0"
description = "State-dependent pricing (menu cost) model with Krusell-Smith aggregation, solved in JAX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]==0.4.25",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6", "statsmodels>=0.14",
]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]